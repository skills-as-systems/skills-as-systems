name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: >-
          python -m pip install --disable-pip-version-check jsonschema setuptools wheel
          "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate repository and Agent Skills
        run: python scripts/validate_repository.py --require-skills-ref

      - name: Smoke-test Codex and Claude installations
        run: python scripts/smoke_install.py

      - name: Test SITECRAFT
        run: python skills/sitecraft/run_tests.py

      - name: Test FOUNDRY
        run: python skills/foundry-engineering/run_tests.py

      - name: Test the checkers
        run: |
          python skills/sitecraft/tests/test_checker.py
          python skills/sitecraft/tests/test_render_check.py
          python skills/foundry-engineering/tests/test_foundry_check.py
          python skills/sitecraft/tests/test_gate_log.py
          python skills/foundry-engineering/tests/test_gate_log.py

      - name: Evaluate FOUNDRY routing scenarios
        run: python skills/foundry-engineering/scripts/evaluate_scenarios.py

      - name: Validate paired showcase benchmarks
        run: python scripts/validate_benchmarks.py
